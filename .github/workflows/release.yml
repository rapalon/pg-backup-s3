name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release and attach SBOMs
  packages: write # push to ghcr.io
  id-token: write # cosign keyless signing (Sigstore OIDC)

env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io/${{ github.repository_owner }}/
  IMAGE: ${{ github.event.repository.name }} # ghcr.io/<owner>/<repo>:<tag>

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: go test -race -count=1 ./...
      - run: make vuln
      - run: make test-integration PG_MAJOR=18

  publish:
    name: Build, push, sign
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        name: Version from the tag
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Bake and push the matrix
        id: bake
        uses: docker/bake-action@v6
        with:
          source: .
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ steps.meta.outputs.date }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign every pushed image by digest (keyless)
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          set -eu
          # bake metadata: { "<target>": { "image.name": "a,b", "containerimage.digest": "sha256:..." }, ... }
          echo "$METADATA" | jq -r 'to_entries[] | .value["image.name"] as $names | .value["containerimage.digest"] as $d | ($names | split(",")[]) | "\(.)@\($d)"' \
            | sort -u | while read -r ref; do
                echo "signing $ref"
                cosign sign --yes "$ref"
              done
      - uses: anchore/sbom-action/download-syft@v0
      - name: SBOM per PostgreSQL major
        run: |
          set -eu
          mkdir -p sbom
          for pg in 16 17 18; do
            syft "${REGISTRY}${IMAGE}:${pg}-${{ steps.meta.outputs.version }}" -o spdx-json > "sbom/${IMAGE}-${pg}.spdx.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom
      - name: Release notes
        run: |
          {
            echo "## pgbackup ${{ needs.publish.outputs.version }}"
            echo
            echo "Images (tag = PostgreSQL major of the client tools; pick the one matching or exceeding your server):"
            for pg in 16 17 18; do
              echo "- \`${REGISTRY}${IMAGE}:${pg}-${{ needs.publish.outputs.version }}\` (also \`:${pg}\`), linux/amd64 + linux/arm64, signed with cosign (keyless)"
            done
            echo
            echo "Verify a signature:"
            echo '```'
            echo "cosign verify ${REGISTRY}${IMAGE}:18-${{ needs.publish.outputs.version }} \\"
            echo "  --certificate-identity-regexp '^${{ github.server_url }}/${{ github.repository }}/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "SBOMs (SPDX JSON) are attached. See CHANGELOG.md for changes."
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: sbom/*.spdx.json
          generate_release_notes: true
