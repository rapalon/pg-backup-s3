name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt, vet, staticcheck
        run: make lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: go test -race
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  vuln:
    name: Vulnerability check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: make vuln

  integration:
    name: Integration (PostgreSQL ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: [lint, unit]
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17", "18"]
    steps:
      - uses: actions/checkout@v7
      - name: Stand + go test -tags integration
        run: make test-integration PG_MAJOR=${{ matrix.pg }} 2>&1 | tee integration.log
      # Job logs need admin rights to read through the API; annotations do not.
      # On failure, surface the failing tests and the log tail as annotations.
      - name: Summary as annotations
        if: always()
        run: |
          enc() { perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'; }
          summary="$(grep -E '^(ok  |FAIL|---|\?|=== RUN)|_test\.go:[0-9]+:|no test files|skipped' integration.log | head -80 | head -c 3800 | enc)"
          echo "::notice title=Integration PG ${{ matrix.pg }} — go test summary::${summary:-no go test output found}"
          if [ "${{ job.status }}" != "success" ]; then
            tail="$(tail -n 80 integration.log | tail -c 3800 | enc)"
            echo "::error title=Integration PG ${{ matrix.pg }} — log tail::${tail}"
          fi

  build:
    name: Build matrix (no push)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Bake all majors for amd64 and arm64
        uses: docker/bake-action@v7
        with:
          source: .
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
        env:
          VERSION: ${{ github.sha }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}

  image:
    name: Image gate (size, scan, smoke)
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build pgbackup:18 for the host arch
        run: make docker-build PG_MAJOR=18 VERSION=${{ github.sha }} COMMIT=${{ github.sha }}
      - name: Size gate
        run: make image-size PG_MAJOR=18
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pgbackup:18
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Smoke test with a read-only root filesystem
        run: make test-image PG_MAJOR=18 2>&1 | tee smoke.log
      - name: Failure summary as annotations
        if: failure()
        run: |
          enc() { perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g'; }
          tail="$(tail -n 80 smoke.log | tail -c 3800 | enc)"
          echo "::error title=Image smoke test — log tail::${tail}"
